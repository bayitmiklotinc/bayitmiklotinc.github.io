# PROPOSED: rebuild GitHub Pages every morning so future-dated (embargoed)
# press releases go live on their date without anyone pushing a commit.
# The new release then appears in /press/feed.xml, which Postiz picks up.
name: Scheduled Pages rebuild
on:
  schedule:
    - cron: "5 13 * * *"     # 08:05 Dallas time (CDT); adjust for CST in winter
  workflow_dispatch: {}
permissions:
  pages: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Request a Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
