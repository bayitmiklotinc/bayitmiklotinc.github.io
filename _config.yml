# Site configuration. GitHub Pages builds this repository with Jekyll.
# Shared header/footer live in _includes/, the page shell in _layouts/,
# and organization facts (phone, email, EIN) in _data/site.yml.

title: "Bayit Miklot"
tagline: "Home of Refuge"
description: >-
  Bayit Miklot is a Dallas, Texas 501(c)(3) nonprofit bringing together Jewish
  recovery housing, addiction recovery support, coordinated mental health care,
  and lifelong community.
url: "https://bayitmiklot.com"
baseurl: ""
lang: en_US
logo: /assets/logo.png

# Every existing page keeps its current .html address.
defaults:
  - scope: { path: "" }
    values:
      layout: default
      image: /assets/og-image.jpg
  - scope: { path: "", type: press }
    values:
      layout: press-release

collections:
  press:
    output: true
    permalink: /press/:year/:month/:title/

plugins:            # all three are supported by GitHub Pages
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

feed:
  collections:
    press:
      path: /press/feed.xml

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .jekyll-cache/
