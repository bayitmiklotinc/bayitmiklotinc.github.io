{%- assign org = site.data.org -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "NGO",
  "@id": "{{ site.url }}/#organization",
  "name": {{ org.name | jsonify }},
  "legalName": {{ org.legal_name | jsonify }},
  "alternateName": "Bayit Miklot — Home of Refuge",
  "url": "{{ site.url }}/",
  "logo": "{{ site.url }}/assets/logo.png",
  "description": {{ site.description | jsonify }},
  "nonprofitStatus": "Nonprofit501c3",
  "email": {{ org.email | jsonify }},
  "telephone": {{ org.phone | jsonify }},
  "areaServed": { "@type": "City", "name": "Dallas, Texas" },
  "address": {
    "@type": "PostalAddress",
    {%- if org.street != "" %}"streetAddress": {{ org.street | jsonify }}, "postalCode": {{ org.postal_code | jsonify }},{% endif %}
    "addressLocality": {{ org.city | jsonify }},
    "addressRegion": {{ org.region | jsonify }},
    "addressCountry": {{ org.country | jsonify }}
  },
  "founder": { "@type": "Person", "name": {{ org.contact_name | jsonify }}, "jobTitle": {{ org.contact_role | jsonify }} },
  "sameAs": {{ site.social.links | jsonify }}
}
</script>
