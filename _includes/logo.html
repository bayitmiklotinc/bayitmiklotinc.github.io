{%- comment -%}
  Two logos: the normal one, and a light-lettered one shown only in the dark-mode
  preview (CSS picks which is visible). The dark one is lazy-loaded, so regular
  visitors never download it. Pass loading="lazy" for the footer.
{%- endcomment -%}
<picture class="logo-light">
  <source type="image/webp" srcset="/assets/logo.webp">
  <img src="/assets/logo.png" alt="Bayit Miklot — Home of Refuge" width="1022" height="230"{% if include.loading %} loading="{{ include.loading }}" decoding="async"{% endif %}>
</picture>
<picture class="logo-dark">
  <source type="image/webp" srcset="/assets/logo-dark.webp">
  <img src="/assets/logo-dark.png" alt="Bayit Miklot — Home of Refuge" width="1022" height="230" loading="lazy" decoding="async">
</picture>
